---
# validation.yml -- Module 10 (Creating a Job Template with a Survey)
# Checks: "Install Apache with Survey" exists with survey enabled and has been successfully launched.

- name: Log validation start
  ansible.builtin.shell: echo "Validating module-10" >> /tmp/progress.log

- name: Check Install Apache with Survey template exists
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/job_templates/?name=Install+Apache+with+Survey"
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
  register: r_template

- name: Set template_id
  ansible.builtin.set_fact:
    template_id: "{{ r_template.json.results[0].id | default(0) | int }}"

- name: Check for a successful job run
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/jobs/?job_template={{ template_id }}&status=successful"
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: [200, 404]
  register: r_jobs
  when: r_template.json.count > 0

- name: Set validation results
  ansible.builtin.set_fact:
    v_exists: "{{ r_template.json.count > 0 }}"
    v_survey_enabled: "{{ r_template.json.results[0].survey_enabled | default(false) | bool if r_template.json.count > 0 else false }}"
    v_job_run: "{{ (r_jobs.json.count | default(0)) > 0 }}"

- name: Set validation output
  ansible.builtin.set_fact:
    validation_output: |
      Module 10 Validation
      ====================
      {{ '[OK]' if v_exists else '[X] ' }} Job template: Install Apache with Survey
      {{ '[OK]' if v_survey_enabled else '[X] ' }} Survey enabled
      {{ '[OK]' if v_job_run else '[X] ' }} Job launched successfully
    validation_passed: "{{ v_exists and v_survey_enabled and v_job_run }}"

- name: Write failure details
  ansible.builtin.copy:
    content: "{{ validation_output }}"
    dest: "{{ job_info_dir }}/validation_failure.out"
  delegate_to: localhost
  when:
    - job_info_dir is defined
    - not validation_passed | bool

- name: Fail if not passed
  ansible.builtin.fail:
    msg: "Complete the missing tasks and try again."
  when: not validation_passed | bool

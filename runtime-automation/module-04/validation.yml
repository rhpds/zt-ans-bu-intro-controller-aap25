---
# validation.yml -- Module 04 (Creating your first Project)
# Checks: Apache playbooks project exists and sync is successful.

- name: Log validation start
  ansible.builtin.shell: echo "Validating module-04" >> /tmp/progress.log

- name: Check Apache playbooks project exists and status
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/projects/?name=Apache+playbooks"
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
  register: r_project

- name: Set validation results
  ansible.builtin.set_fact:
    v_exists: "{{ r_project.json.count > 0 }}"
    v_synced: "{{ r_project.json.results[0].status == 'successful' if r_project.json.count > 0 else false }}"

- name: Set validation output
  ansible.builtin.set_fact:
    validation_output: |
      Module 4 Validation
      ===================
      {{ '[OK]' if v_exists else '[X] ' }} Project: Apache playbooks
      {{ '[OK]' if v_synced else '[X] ' }} Project sync: Successful
    validation_passed: "{{ v_exists and v_synced }}"

- name: Write failure details
  ansible.builtin.copy:
    content: "{{ validation_output }}"
    dest: "{{ job_info_dir }}/validation_failure.out"
  delegate_to: localhost
  when:
    - job_info_dir is defined
    - not validation_passed | bool

- name: Fail if not passed
  ansible.builtin.fail:
    msg: "Complete the missing tasks and try again."
  when: not validation_passed | bool

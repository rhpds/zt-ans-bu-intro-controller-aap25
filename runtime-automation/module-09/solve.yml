---
# solve.yml -- Module 09 (Creating a Workflow Job Template)
# Creates: "Your first workflow" with apache101 -> (extended201 + motd201) nodes.
# Launches: The workflow and waits for successful completion.

- name: Log solve start
  ansible.builtin.shell: echo "Solving module-09" >> /tmp/progress.log

- name: Get Default organization ID
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/organizations/?name=Default"
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
  register: r_org

- name: Get Lab-Inventory ID
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/inventories/?name=Lab-Inventory"
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
  register: r_inventory

- name: Get Install Apache job template ID
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/job_templates/?name=Install+Apache"
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
  register: r_jt_apache

- name: Get Extended services job template ID
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/job_templates/?name=Extended+services"
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
  register: r_jt_extended

- name: Get Set motd job template ID
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/job_templates/?name=Set+motd"
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
  register: r_jt_motd

- name: Check if Your first workflow exists
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/workflow_job_templates/?name=Your+first+workflow"
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
  register: r_wf_check

- name: Create Your first workflow
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/workflow_job_templates/"
    method: POST
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body:
      name: "Your first workflow"
      description: "Create a Workflow from previous Job Templates"
      organization: "{{ r_org.json.results[0].id | int }}"
      inventory: "{{ r_inventory.json.results[0].id | int }}"
    status_code: [200, 201]
  when: r_wf_check.json.count == 0

- name: Get Your first workflow ID
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/workflow_job_templates/?name=Your+first+workflow"
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
  register: r_wf

- name: Set wf_id
  ansible.builtin.set_fact:
    wf_id: "{{ r_wf.json.results[0].id | int }}"

- name: Create apache101 workflow node (Install Apache)
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/workflow_job_templates/{{ wf_id }}/workflow_nodes/"
    method: POST
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body:
      unified_job_template: "{{ r_jt_apache.json.results[0].id | int }}"
    status_code: [200, 201]
  register: r_node_apache
  when: r_wf_check.json.count == 0

- name: Create extended201 workflow node (Extended services)
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/workflow_job_templates/{{ wf_id }}/workflow_nodes/"
    method: POST
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body:
      unified_job_template: "{{ r_jt_extended.json.results[0].id | int }}"
    status_code: [200, 201]
  register: r_node_extended
  when: r_wf_check.json.count == 0

- name: Create motd201 workflow node (Set motd)
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/workflow_job_templates/{{ wf_id }}/workflow_nodes/"
    method: POST
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body:
      unified_job_template: "{{ r_jt_motd.json.results[0].id | int }}"
    status_code: [200, 201]
  register: r_node_motd
  when: r_wf_check.json.count == 0

- name: Link apache101 -> extended201 on success
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/workflow_job_template_nodes/{{ r_node_apache.json.id }}/success_nodes/"
    method: POST
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body: "{{ {'id': r_node_extended.json.id | int} }}"
    status_code: [200, 201, 204]
  when: r_wf_check.json.count == 0

- name: Link apache101 -> motd201 on success
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/workflow_job_template_nodes/{{ r_node_apache.json.id }}/success_nodes/"
    method: POST
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body: "{{ {'id': r_node_motd.json.id | int} }}"
    status_code: [200, 201, 204]
  when: r_wf_check.json.count == 0

- name: Launch Your first workflow
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/workflow_job_templates/{{ wf_id }}/launch/"
    method: POST
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body: {}
    status_code: [200, 201]
  register: r_wf_job

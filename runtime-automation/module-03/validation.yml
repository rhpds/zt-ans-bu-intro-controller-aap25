---
# validation.yml -- Module 03 (Creating an Inventory)
# Checks: Lab-Inventory, node1, node2, web group, and both hosts in web group.

- name: Log validation start
  ansible.builtin.shell: echo "Validating module-03" >> /tmp/progress.log

- name: Check Lab-Inventory exists
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/inventories/?name=Lab-Inventory"
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
  register: r_inventory

- name: Set inventory_id
  ansible.builtin.set_fact:
    inventory_id: "{{ r_inventory.json.results[0].id | default(0) | int }}"

- name: Check node1 exists in Lab-Inventory
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/hosts/?name=node1&inventory={{ inventory_id }}"
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
  register: r_node1

- name: Check node2 exists in Lab-Inventory
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/hosts/?name=node2&inventory={{ inventory_id }}"
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
  register: r_node2

- name: Check web group exists in Lab-Inventory
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/groups/?name=web&inventory={{ inventory_id }}"
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
  register: r_group

- name: Set group_id
  ansible.builtin.set_fact:
    group_id: "{{ r_group.json.results[0].id | default(0) | int }}"

- name: Check hosts in web group
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/groups/{{ group_id }}/hosts/"
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: [200, 404]
  register: r_group_hosts

- name: Set validation results
  ansible.builtin.set_fact:
    validation_output: |
      Module 3 Validation
      ===================
      {{ '[OK]' if r_inventory.json.count > 0 else '[X] ' }} Inventory: Lab-Inventory
      {{ '[OK]' if r_node1.json.count > 0 else '[X] ' }} Host: node1 (in Lab-Inventory)
      {{ '[OK]' if r_node2.json.count > 0 else '[X] ' }} Host: node2 (in Lab-Inventory)
      {{ '[OK]' if r_group.json.count > 0 else '[X] ' }} Group: web (in Lab-Inventory)
      {{ '[OK]' if (r_group_hosts.json.count | default(0)) >= 2 else '[X] ' }} node1 and node2 added to web group
    validation_passed: >-
      {{ r_inventory.json.count > 0 and
         r_node1.json.count > 0 and
         r_node2.json.count > 0 and
         r_group.json.count > 0 and
         (r_group_hosts.json.count | default(0)) >= 2 }}

- name: Write failure details
  ansible.builtin.copy:
    content: "{{ validation_output }}"
    dest: "{{ job_info_dir }}/validation_failure.out"
  delegate_to: localhost
  when:
    - job_info_dir is defined
    - not validation_passed | bool

- name: Fail if not passed
  ansible.builtin.fail:
    msg: "Complete the missing tasks and try again."
  when: not validation_passed | bool

---
# validation.yml -- Module 06 (Creating a Job Template)
# Checks: Install Apache job template exists with correct inventory, project, and credential.

- name: Log validation start
  ansible.builtin.shell: echo "Validating module-06" >> /tmp/progress.log

- name: Check Install Apache job template exists
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/job_templates/?name=Install+Apache"
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
  register: r_template

- name: Set template_id
  ansible.builtin.set_fact:
    template_id: "{{ r_template.json.results[0].id | default(0) | int }}"

- name: Check lab-credentials is associated with template
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/job_templates/{{ template_id }}/credentials/?name=lab-credentials"
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: [200, 404]
  register: r_cred
  when: r_template.json.count > 0

- name: Set validation results
  ansible.builtin.set_fact:
    v_exists: "{{ r_template.json.count > 0 }}"
    v_correct_inventory: "{{ r_template.json.results[0].summary_fields.inventory.name == 'Lab-Inventory' if r_template.json.count > 0 else false }}"
    v_correct_project: "{{ r_template.json.results[0].summary_fields.project.name == 'Apache playbooks' if r_template.json.count > 0 else false }}"
    v_correct_playbook: "{{ r_template.json.results[0].playbook == 'apache.yml' if r_template.json.count > 0 else false }}"
    v_cred_linked: "{{ (r_cred.json.count | default(0)) > 0 }}"

- name: Set validation output
  ansible.builtin.set_fact:
    validation_output: |
      Module 6 Validation
      ===================
      {{ '[OK]' if v_exists else '[X] ' }} Job template: Install Apache
      {{ '[OK]' if v_correct_inventory else '[X] ' }} Inventory: Lab-Inventory
      {{ '[OK]' if v_correct_project else '[X] ' }} Project: Apache playbooks
      {{ '[OK]' if v_correct_playbook else '[X] ' }} Playbook: apache.yml
      {{ '[OK]' if v_cred_linked else '[X] ' }} Credential: lab-credentials
    validation_passed: "{{ v_exists and v_correct_inventory and v_correct_project and v_correct_playbook and v_cred_linked }}"

- name: Write failure details
  ansible.builtin.copy:
    content: "{{ validation_output }}"
    dest: "{{ job_info_dir }}/validation_failure.out"
  delegate_to: localhost
  when:
    - job_info_dir is defined
    - not validation_passed | bool

- name: Fail if not passed
  ansible.builtin.fail:
    msg: "Complete the missing tasks and try again."
  when: not validation_passed | bool

---
# solve.yml -- Module 06 (Creating a Job Template)
# Delegates to the control node to run the CaC staged playbook,
# then launches the Install Apache job.

- name: Run CaC staged playbook for module-06
  ansible.builtin.shell: >-
    /tmp/cac-venv/bin/ansible-playbook
    /tmp/controller-as-code/configure_controller_staged.yml
    -e module=module-06
  delegate_to: "{{ bastion_host }}"
  become: true

- name: Get Install Apache template ID
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/job_templates/?name=Install+Apache"
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
  register: r_template

- name: Launch Install Apache
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/job_templates/{{ r_template.json.results[0].id }}/launch/"
    method: POST
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body: {}
    status_code: [200, 201]
  when: r_template.json.count > 0

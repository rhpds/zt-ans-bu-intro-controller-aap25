---
# solve.yml -- Module 06 (Creating a Job Template)
# Creates: Install Apache job template with Lab-Inventory, Apache playbooks, lab-credentials.
# Launches: Install Apache job and waits for successful completion.

- name: Log solve start
  ansible.builtin.shell: echo "Solving module-06" >> /tmp/progress.log

- name: Get Lab-Inventory ID
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/inventories/?name=Lab-Inventory"
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
  register: r_inventory

- name: Get Apache playbooks project ID
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/projects/?name=Apache+playbooks"
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
  register: r_project

- name: Get lab-credentials ID
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/credentials/?name=lab-credentials"
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
  register: r_credential

- name: Check if Install Apache template exists
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/job_templates/?name=Install+Apache"
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
  register: r_template_check

- name: Create Install Apache job template
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/job_templates/"
    method: POST
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body:
      name: "Install Apache"
      inventory: "{{ r_inventory.json.results[0].id | int }}"
      project: "{{ r_project.json.results[0].id | int }}"
      playbook: "apache.yml"
      become_enabled: true
    status_code: [200, 201]
  when: r_template_check.json.count == 0

- name: Get Install Apache template ID
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/job_templates/?name=Install+Apache"
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
  register: r_template

- name: Set template_id
  ansible.builtin.set_fact:
    template_id: "{{ r_template.json.results[0].id | int }}"

- name: Check if lab-credentials is associated with template
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/job_templates/{{ template_id }}/credentials/?name=lab-credentials"
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
  register: r_cred_check

- name: Associate lab-credentials with Install Apache template
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/job_templates/{{ template_id }}/credentials/"
    method: POST
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body: "{{ {'id': r_credential.json.results[0].id | int} }}"
    status_code: [200, 201, 204]
  when: r_cred_check.json.count == 0

- name: Launch Install Apache job
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/job_templates/{{ template_id }}/launch/"
    method: POST
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body: {}
    status_code: [200, 201]
  register: r_job

- name: Wait for Install Apache job to complete
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/jobs/{{ r_job.json.id }}/"
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
  register: r_job_status
  until: r_job_status.json.status in ['successful', 'failed', 'error', 'canceled']
  retries: 30
  delay: 10

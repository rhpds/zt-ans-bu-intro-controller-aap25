---
# solve.yml -- Module 08 (Creating Multiple Job Templates)
# Creates: node3 host, database group, Extended services and Set motd templates.
# Launches: Both job templates and waits for successful completion.

- name: Log solve start
  ansible.builtin.shell: echo "Solving module-08" >> /tmp/progress.log

- name: Get Lab-Inventory ID
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/inventories/?name=Lab-Inventory"
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
  register: r_inventory

- name: Set inventory_id
  ansible.builtin.set_fact:
    inventory_id: "{{ r_inventory.json.results[0].id | int }}"

- name: Get Additional playbooks project ID
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/projects/?name=Additional+playbooks"
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
  register: r_project

- name: Get lab-credentials ID
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/credentials/?name=lab-credentials"
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
  register: r_credential

- name: Check if node3 exists in Lab-Inventory
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/hosts/?name=node3&inventory={{ inventory_id }}"
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
  register: r_node3_check

- name: Create node3 host
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/hosts/"
    method: POST
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body:
      name: "node3"
      inventory: "{{ inventory_id | int }}"
    status_code: [200, 201]
  when: r_node3_check.json.count == 0

- name: Get node3 ID
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/hosts/?name=node3&inventory={{ inventory_id }}"
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
  register: r_node3

- name: Set node3_id
  ansible.builtin.set_fact:
    node3_id: "{{ r_node3.json.results[0].id | int }}"

- name: Check if database group exists
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/groups/?name=database&inventory={{ inventory_id }}"
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
  register: r_group_check

- name: Create database group
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/groups/"
    method: POST
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body:
      name: "database"
      inventory: "{{ inventory_id | int }}"
    status_code: [200, 201]
  when: r_group_check.json.count == 0

- name: Get database group ID
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/groups/?name=database&inventory={{ inventory_id }}"
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
  register: r_group

- name: Set group_id
  ansible.builtin.set_fact:
    group_id: "{{ r_group.json.results[0].id | int }}"

- name: Check if node3 is in database group
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/groups/{{ group_id }}/hosts/?name=node3"
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
  register: r_node3_in_group

- name: Add node3 to database group
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/groups/{{ group_id }}/hosts/"
    method: POST
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body: "{{ {'id': node3_id | int} }}"
    status_code: [200, 201, 204]
  when: r_node3_in_group.json.count == 0

# Extended services template

- name: Check if Extended services template exists
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/job_templates/?name=Extended+services"
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
  register: r_ext_check

- name: Create Extended services job template
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/job_templates/"
    method: POST
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body:
      name: "Extended services"
      inventory: "{{ inventory_id | int }}"
      project: "{{ r_project.json.results[0].id | int }}"
      playbook: "extended_services.yml"
      become_enabled: true
    status_code: [200, 201]
  when: r_ext_check.json.count == 0

- name: Get Extended services template ID
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/job_templates/?name=Extended+services"
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
  register: r_ext

- name: Set ext_template_id
  ansible.builtin.set_fact:
    ext_template_id: "{{ r_ext.json.results[0].id | int }}"

- name: Check if lab-credentials is associated with Extended services
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/job_templates/{{ ext_template_id }}/credentials/?name=lab-credentials"
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
  register: r_ext_cred_check

- name: Associate lab-credentials with Extended services
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/job_templates/{{ ext_template_id }}/credentials/"
    method: POST
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body: "{{ {'id': r_credential.json.results[0].id | int} }}"
    status_code: [200, 201, 204]
  when: r_ext_cred_check.json.count == 0

- name: Launch Extended services job
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/job_templates/{{ ext_template_id }}/launch/"
    method: POST
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body: {}
    status_code: [200, 201]
  register: r_ext_job

# Set motd template

- name: Check if Set motd template exists
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/job_templates/?name=Set+motd"
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
  register: r_motd_check

- name: Create Set motd job template
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/job_templates/"
    method: POST
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body:
      name: "Set motd"
      inventory: "{{ inventory_id | int }}"
      project: "{{ r_project.json.results[0].id | int }}"
      playbook: "motd_facts.yml"
      become_enabled: true
    status_code: [200, 201]
  when: r_motd_check.json.count == 0

- name: Get Set motd template ID
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/job_templates/?name=Set+motd"
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
  register: r_motd

- name: Set motd_template_id
  ansible.builtin.set_fact:
    motd_template_id: "{{ r_motd.json.results[0].id | int }}"

- name: Check if lab-credentials is associated with Set motd
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/job_templates/{{ motd_template_id }}/credentials/?name=lab-credentials"
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
  register: r_motd_cred_check

- name: Associate lab-credentials with Set motd
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/job_templates/{{ motd_template_id }}/credentials/"
    method: POST
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body: "{{ {'id': r_credential.json.results[0].id | int} }}"
    status_code: [200, 201, 204]
  when: r_motd_cred_check.json.count == 0

- name: Launch Set motd job
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/job_templates/{{ motd_template_id }}/launch/"
    method: POST
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body: {}
    status_code: [200, 201]
  register: r_motd_job

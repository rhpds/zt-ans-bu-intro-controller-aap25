---
# validation.yml -- Module 08 (Creating Multiple Job Templates)
# Checks: node3 host, database group, Extended services and Set motd templates, successful job runs.

- name: Log validation start
  ansible.builtin.shell: echo "Validating module-08" >> /tmp/progress.log

- name: Get Lab-Inventory ID
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/inventories/?name=Lab-Inventory"
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
  register: r_inventory

- name: Set inventory_id
  ansible.builtin.set_fact:
    inventory_id: "{{ r_inventory.json.results[0].id | default(0) | int }}"

- name: Check node3 exists in Lab-Inventory
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/hosts/?name=node3&inventory={{ inventory_id }}"
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
  register: r_node3

- name: Check database group exists in Lab-Inventory
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/groups/?name=database&inventory={{ inventory_id }}"
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
  register: r_group

- name: Set group_id
  ansible.builtin.set_fact:
    group_id: "{{ r_group.json.results[0].id | default(0) | int }}"

- name: Check node3 is in database group
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/groups/{{ group_id }}/hosts/?name=node3"
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: [200, 404]
  register: r_node3_in_group
  when: r_group.json.count > 0

- name: Check Extended services template exists
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/job_templates/?name=Extended+services"
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
  register: r_ext

- name: Set ext_template_id
  ansible.builtin.set_fact:
    ext_template_id: "{{ r_ext.json.results[0].id | default(0) | int }}"

- name: Check Set motd template exists
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/job_templates/?name=Set+motd"
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
  register: r_motd

- name: Set motd_template_id
  ansible.builtin.set_fact:
    motd_template_id: "{{ r_motd.json.results[0].id | default(0) | int }}"

- name: Check for a successful Extended services job run
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/jobs/?job_template={{ ext_template_id }}&status=successful"
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: [200, 404]
  register: r_ext_jobs
  when: r_ext.json.count > 0

- name: Check for a successful Set motd job run
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/jobs/?job_template={{ motd_template_id }}&status=successful"
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: [200, 404]
  register: r_motd_jobs
  when: r_motd.json.count > 0

- name: Set validation results
  ansible.builtin.set_fact:
    v_node3: "{{ r_node3.json.count > 0 }}"
    v_database_group: "{{ r_group.json.count > 0 }}"
    v_node3_in_group: "{{ (r_node3_in_group.json.count | default(0)) > 0 }}"
    v_ext_exists: "{{ r_ext.json.count > 0 }}"
    v_ext_correct_project: "{{ r_ext.json.results[0].summary_fields.project.name == 'Additional playbooks' if r_ext.json.count > 0 else false }}"
    v_motd_exists: "{{ r_motd.json.count > 0 }}"
    v_motd_correct_project: "{{ r_motd.json.results[0].summary_fields.project.name == 'Additional playbooks' if r_motd.json.count > 0 else false }}"
    v_ext_job_run: "{{ (r_ext_jobs.json.count | default(0)) > 0 }}"
    v_motd_job_run: "{{ (r_motd_jobs.json.count | default(0)) > 0 }}"

- name: Set validation output
  ansible.builtin.set_fact:
    validation_output: |
      Module 8 Validation
      ===================
      {{ '[OK]' if v_node3 else '[X] ' }} Host: node3 (in Lab-Inventory)
      {{ '[OK]' if v_database_group else '[X] ' }} Group: database (in Lab-Inventory)
      {{ '[OK]' if v_node3_in_group else '[X] ' }} node3 added to database group
      {{ '[OK]' if v_ext_exists else '[X] ' }} Job template: Extended services
      {{ '[OK]' if v_ext_correct_project else '[X] ' }} Extended services project: Additional playbooks
      {{ '[OK]' if v_motd_exists else '[X] ' }} Job template: Set motd
      {{ '[OK]' if v_motd_correct_project else '[X] ' }} Set motd project: Additional playbooks
      {{ '[OK]' if v_ext_job_run else '[X] ' }} Extended services launched successfully
      {{ '[OK]' if v_motd_job_run else '[X] ' }} Set motd launched successfully
    validation_passed: >-
      {{ v_node3 and v_database_group and v_node3_in_group and
         v_ext_exists and v_ext_correct_project and
         v_motd_exists and v_motd_correct_project and
         v_ext_job_run and v_motd_job_run }}

- name: Write failure details
  ansible.builtin.copy:
    content: "{{ validation_output }}"
    dest: "{{ job_info_dir }}/validation_failure.out"
  delegate_to: localhost
  when:
    - job_info_dir is defined
    - not validation_passed | bool

- name: Fail if not passed
  ansible.builtin.fail:
    msg: "Complete the missing tasks and try again."
  when: not validation_passed | bool
